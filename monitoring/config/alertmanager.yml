route:
  receiver: 'email'
receivers:
  - name: 'email'
    email_configs:
      - to: 'team@example.com'
        send_resolved: true
route:
  receiver: 'slack'
receivers:
  - name: 'slack'
    slack_configs:
      - channel: '#alerts'
        api_url: 'https://hooks.slack.com/services/XXXXX/YYYYY/ZZZZZ'
        send_resolved: true