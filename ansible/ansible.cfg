[defaults]
# fact を ansible_* の変数としても参照できるようにする（ansible_os_family など）。develop-setting がこの記法を使う
# 以前は綴りの違うキー名で False を指定していたため、設定が無視されて実効値は既定の True だった。
# 動作を変えずに、実際の値を明示する。False にすると develop-setting の ansible_os_family などの参照が壊れる
inject_facts_as_vars = True
ansible_ssh_timeout=60
host_key_checking = False

# Show task timing
callbacks_enabled = timer, profile_tasks

# retry files are not needed
retry_files_enabled = False

stdout_callback = default
result_format = yaml
