---
# Raspiだけに適用するような特殊タスクを記載する
- name: raspi setting
  hosts: raspi
  become: true
  become_user: root
  gather_facts: yes
  ignore_unreachable: true
  tasks:
    - name: Install raspi tools
      ansible.builtin.package:
        name:
          - raspi-config
          - rpi-eeprom
        state: present


