---
# vpn_proxy role tasks
# Pipeline order: log dirs → SSL cert → .env → nginx.conf → default.conf → backends → compose up → nginx -t → handler reload

# 1. Create nginx log directory
- name: Create nginx log directory
  ansible.builtin.file:
    path: "{{ vpn_proxy_service_dir }}/logs/nginx"
    state: directory
    owner: "{{ manage_user_name }}"
    group: "{{ manage_user_group }}"
    mode: "0755"

# 2. Create SSL certificate directory
- name: Create SSL certificate directory
  ansible.builtin.file:
    path: "{{ vpn_proxy_service_dir }}/nginx/ssl"
    state: directory
    owner: "{{ manage_user_name }}"
    group: "{{ manage_user_group }}"
    mode: "0750"

# 3. Check if SSL certificate exists
- name: Check if SSL certificate exists
  ansible.builtin.stat:
    path: "{{ vpn_proxy_service_dir }}/nginx/ssl/cert.pem"
  register: vpn_proxy_cert_stat

# 4. Generate self-signed certificate (EC P-384 + SAN) if not present
- name: Generate self-signed SSL certificate
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes
      -newkey ec
      -pkeyopt ec_paramgen_curve:{{ vpn_proxy_ssl_curve }}
      -days {{ vpn_proxy_ssl_days }}
      -keyout {{ vpn_proxy_service_dir }}/nginx/ssl/key.pem
      -out {{ vpn_proxy_service_dir }}/nginx/ssl/cert.pem
      -subj "/CN={{ vpn_proxy_ssl_cn }}"
      -addext "subjectAltName={% for b in vpn_proxy_backends %}DNS:{{ b.server_name }}{% if not loop.last %},{% endif %}{% endfor %}"
    creates: "{{ vpn_proxy_service_dir }}/nginx/ssl/cert.pem"
  become: true
  become_user: "{{ manage_user_name }}"
  when: not vpn_proxy_cert_stat.stat.exists

# 5. Deploy .env file from Vault variables
- name: Deploy .env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ vpn_proxy_service_dir }}/.env"
    owner: "{{ manage_user_name }}"
    group: "{{ manage_user_group }}"
    mode: "0600"
  notify: nginx_reload

# 6. Deploy nginx.conf
- name: Deploy nginx.conf
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../service/vpn-proxy/nginx/nginx.conf"
    dest: "{{ vpn_proxy_service_dir }}/nginx/nginx.conf"
    owner: "{{ manage_user_name }}"
    group: "{{ manage_user_group }}"
    mode: "0644"
  notify: nginx_reload

# 7. Deploy default.conf from template
- name: Deploy default.conf from template
  ansible.builtin.template:
    src: default.conf.j2
    dest: "{{ vpn_proxy_service_dir }}/nginx/conf.d/default.conf"
    owner: "{{ manage_user_name }}"
    group: "{{ manage_user_group }}"
    mode: "0644"
  notify: nginx_reload

# 8. Deploy per-backend virtual host configuration files
- name: Deploy backend virtual host configurations
  ansible.builtin.template:
    src: backend.conf.j2
    dest: "{{ vpn_proxy_service_dir }}/nginx/conf.d/{{ item.name }}.conf"
    owner: "{{ manage_user_name }}"
    group: "{{ manage_user_group }}"
    mode: "0644"
  loop: "{{ vpn_proxy_backends }}"
  loop_control:
    label: "{{ item.name }}"
  notify: nginx_reload

# 9. Start Docker Compose services (idempotent)
- name: Start vpn-proxy Docker Compose services
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ vpn_proxy_service_dir }}"
  become: true
  become_user: "{{ manage_user_name }}"
  register: vpn_proxy_compose_up
  changed_when: "'Started' in vpn_proxy_compose_up.stdout or 'Created' in vpn_proxy_compose_up.stdout"

# 10. Validate nginx configuration syntax (nginx -t) — abort deployment on failure
- name: Validate nginx configuration syntax
  ansible.builtin.command:
    cmd: docker compose exec -T nginx nginx -t
    chdir: "{{ vpn_proxy_service_dir }}"
  become: true
  become_user: "{{ manage_user_name }}"
  register: vpn_proxy_nginx_test
  failed_when: vpn_proxy_nginx_test.rc != 0
  changed_when: false
