---
# service_compose role default variables
# vpn_proxy role を一般化した汎用 docker compose デプロイ role
#
# 前提: ターゲットホストには ansible/git.yml で infra リポジトリが
#       /home/{{ manage_user_name }}/infra に clone/update 済み。
#       docker-compose.yml や追跡済み config はその checkout を直接使うため、
#       本 role は gitignore 対象(.env / secret files)の生成と compose 起動のみ行う。

# サービス名（ディレクトリ名やラベル表示に使用）
service_compose_name: ""

# ターゲットホスト上のサービスディレクトリ（git.yml の checkout 内を直接使う）
service_compose_dir: "/home/{{ manage_user_name }}/infra/service/{{ service_compose_name }}"

# .env に書き出す環境変数（dict）。秘密値は vault 前提
service_compose_env: {}

# gitignore対象などリポジトリに存在しない秘密ファイルを vault 変数から書き出す一覧
# 例: [{ dest: "config/gcp-credentials.json", content: "{{ crypt_llm_proxy_gcp_credentials }}" }]
# dest は service_compose_dir からの相対パス
service_compose_secret_files: []

# デプロイ後に実行する任意のヘルスチェックコマンド（空文字なら実行しない）
service_compose_healthcheck: ""

# 自己署名 SSL 証明書の生成（任意機能）。nginx で TLS 終端するサービス(vpn-proxy 等)で使う。
# 証明書/鍵は gitignore 対象のため checkout には無く、初回のみ host 上で生成する(creates ガード)。
service_compose_ssl_enabled: false
service_compose_ssl_dir: "{{ service_compose_dir }}/nginx/ssl"
service_compose_ssl_cert: "{{ service_compose_ssl_dir }}/cert.pem"
service_compose_ssl_key: "{{ service_compose_ssl_dir }}/key.pem"
service_compose_ssl_cn: ""
service_compose_ssl_sans: []        # SAN に入れる DNS 名のリスト
service_compose_ssl_days: 825
service_compose_ssl_curve: secp384r1

# Let's Encrypt 証明書の初回発行（任意機能）。インターネットから :80 に届くホスト(外部 VPS 等)で使う。
# 証明書が未取得のときだけ、HTTP を受ける compose サービスを止めて certbot standalone で発行する。
# 更新は compose 側の certbot コンテナ（certbot renew --webroot）が担う。
service_compose_letsencrypt_enabled: false
service_compose_letsencrypt_domains: []   # 先頭がファイル名(live/<先頭>/)になる
service_compose_letsencrypt_email: ""     # 空なら --register-unsafely-without-email
service_compose_letsencrypt_staging: false
service_compose_letsencrypt_image: certbot/certbot
service_compose_letsencrypt_conf_dir: "{{ service_compose_dir }}/data/certbot/conf"
service_compose_letsencrypt_www_dir: "{{ service_compose_dir }}/data/certbot/www"
service_compose_letsencrypt_http_service: nginx   # 発行中に :80 を空けるため止める compose サービス
