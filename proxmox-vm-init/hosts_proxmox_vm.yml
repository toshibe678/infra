---
# Proxmox VM初期設定用インベントリ
# 新しく作成したVMのホスト情報をここに追加

all:
  children:
    proxmox_vms:
      vars:
        ansible_ssh_user: toshi
        ansible_ssh_port: 22
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519
        # 初回はsudoパスワードが必要な場合があります
        # ansible-playbook実行時に --ask-become-pass オプションを使用してください
      hosts:
        # 例: 新しいVMのホスト名またはIPアドレスを追加
        target1:
          ansible_host: 192.168.100.53
        # vm02.example.com:
        #   ansible_host: 192.168.1.101
