version: '3.8'

services:
  # Dify API Service
  api:
    image: langgenius/dify-api:latest
    restart: always
    environment:
      - MODE=api
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-dify}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD}@redis:6379/1}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - VECTOR_STORE=${VECTOR_STORE:-weaviate}
      - WEAVIATE_ENDPOINT=${WEAVIATE_ENDPOINT:-http://weaviate:8080}
    depends_on:
      - db
      - redis
    volumes:
      - ./storage:/app/api/storage
    networks:
      - dify-network

  # Dify Worker Service
  worker:
    image: langgenius/dify-api:latest
    restart: always
    environment:
      - MODE=worker
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-dify}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD}@redis:6379/1}
    depends_on:
      - db
      - redis
    volumes:
      - ./storage:/app/api/storage
    networks:
      - dify-network

  # Dify Web Frontend
  web:
    image: langgenius/dify-web:latest
    restart: always
    environment:
      - CONSOLE_API_URL=${CONSOLE_API_URL:-http://api:5001}
      - APP_API_URL=${APP_API_URL:-http://api:5001}
    networks:
      - dify-network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE:-dify}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - dify-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks:
      - dify-network

  # Weaviate Vector Store
  weaviate:
    image: semitechnologies/weaviate:latest
    restart: always
    environment:
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - QUERY_DEFAULTS_LIMIT=20
      - DEFAULT_VECTORIZER_MODULE=none
      - CLUSTER_HOSTNAME=node1
    volumes:
      - ./data/weaviate:/var/lib/weaviate
    networks:
      - dify-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - dify-network

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: dify-node-exporter
    restart: always
    expose:
      - "9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    networks:
      - dify-network

networks:
  dify-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  weaviate-data:
