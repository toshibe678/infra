events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=mcp_limit:10m rate=10r/s;
    limit_req_status 429;

    # MCP Gateway
    upstream mcp_gateway {
        server mcp-gateway:3000;
    }

    # Individual MCP Servers (for direct access if needed)
    upstream mcp_git {
        server mcp-git:3001;
    }

    upstream mcp_github {
        server mcp-github:3002;
    }

    upstream mcp_filesystem {
        server mcp-filesystem:3003;
    }

    upstream mcp_postgres {
        server mcp-postgres:3004;
    }

    upstream mcp_fetch {
        server mcp-fetch:3005;
    }

    upstream mcp_playwright {
        server mcp-playwright:3006;
    }

    server {
        listen 80;
        server_name mcp.abe365.org;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Main MCP Gateway (unified API)
        location / {
            limit_req zone=mcp_limit burst=20 nodelay;
            
            proxy_pass http://mcp_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Direct access to specific MCP servers (optional)
        location /git/ {
            rewrite ^/git/(.*) /$1 break;
            proxy_pass http://mcp_git;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /github/ {
            rewrite ^/github/(.*) /$1 break;
            proxy_pass http://mcp_github;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /filesystem/ {
            rewrite ^/filesystem/(.*) /$1 break;
            proxy_pass http://mcp_filesystem;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /postgres/ {
            rewrite ^/postgres/(.*) /$1 break;
            proxy_pass http://mcp_postgres;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /fetch/ {
            rewrite ^/fetch/(.*) /$1 break;
            proxy_pass http://mcp_fetch;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /playwright/ {
            rewrite ^/playwright/(.*) /$1 break;
            proxy_pass http://mcp_playwright;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Metrics endpoint for Prometheus
        location /metrics {
            access_log off;
            proxy_pass http://localhost:9100/metrics;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
