# Default server block - Health check and monitoring
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Node Exporter metrics for Prometheus
    location /metrics {
        proxy_pass http://node-exporter:9100/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Security: Allow only from VPN network or monitoring server
        # allow 10.0.0.0/24;  # VPN subnet (adjust to your VPN network)
        # allow 192.168.100.51;  # Monitoring server
        # deny all;
    }

    # Default response
    location / {
        return 404 "VPN Proxy Service - No route defined\n";
        add_header Content-Type text/plain;
    }
}
