# LLM Proxy (LiteLLM / OpenAI-compatible endpoint)
upstream llm_proxy_backend {
    server 192.168.100.54:80;
}

server {
    listen 80;
    server_name vpn.llm-proxy.abe365.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vpn.llm-proxy.abe365.org;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    limit_req zone=general burst=50 nodelay;
    limit_conn conn_limit 20;

    access_log /var/log/nginx/llm-proxy.access.log proxy_log;
    error_log /var/log/nginx/llm-proxy.error.log warn;

    location / {
        proxy_pass http://llm_proxy_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass_request_headers on;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Disable buffering for streaming responses (SSE)
        proxy_buffering off;
        proxy_cache off;
    }
}
