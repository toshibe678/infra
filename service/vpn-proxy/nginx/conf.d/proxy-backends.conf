# VPN Proxy backend configurations
#
# Domain naming convention:
#   vpn.<service>.abe365.org -> 192.168.101.101 (vpn-proxy WireGuard IP)
#   DNS records are defined in cloudflere/records.tf
#
# Service IP mapping (LAN):
#   monitoring  192.168.100.51   vpn.monitoring.abe365.org
#   dify        192.168.100.52   vpn.dify.abe365.org
#   llm-proxy   192.168.100.54   vpn.llm-proxy.abe365.org
#   develop     192.168.100.55   vpn.develop.abe365.org
#   ai-test     192.168.100.56   vpn.ai-test.abe365.org
#   mcp         192.168.100.57   vpn.mcp.abe365.org

# Development Server Proxy
upstream develop_backend {
    server 192.168.100.55:80;
}

server {
    listen 80;
    server_name vpn.develop.abe365.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vpn.develop.abe365.org;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    limit_req zone=general burst=20 nodelay;
    limit_conn conn_limit 10;

    access_log /var/log/nginx/develop-proxy.access.log proxy_log;
    error_log /var/log/nginx/develop-proxy.error.log warn;

    location / {
        proxy_pass http://develop_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
}

