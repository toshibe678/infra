version: '3.8'

services:
  # WGDashboard - WireGuard Management Dashboard
  wgdashboard:
    image: dselen/wgdashboard:latest
    restart: always
    container_name: wgdashboard
    cap_add:
      - NET_ADMIN
    network_mode: host
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - WG_DASHBOARD_USERNAME=${WG_DASHBOARD_USERNAME:-admin}
      - WG_DASHBOARD_PASSWORD=${WG_DASHBOARD_PASSWORD}
    volumes:
      # WireGuard設定ディレクトリをマウント（ホスト側で動作中のWireGuard）
      - /etc/wireguard:/etc/wireguard
      # WGDashboard設定永続化
      - ./data/wgdashboard:/opt/wireguarddashboard/src/db
      - ./data/wgdashboard/log:/opt/wireguarddashboard/src/log
    privileged: true

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      - wgdashboard
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # Certbot for Let's Encrypt SSL
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
