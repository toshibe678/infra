services:
  # WGDashboard - WireGuard Management Dashboard
  wgdashboard:
    image: dselen/wgdashboard:latest
    restart: always
    container_name: wgdashboard
    cap_add:
      - NET_ADMIN
    network_mode: host  # wg showコマンドでホストのWireGuard状態取得に必要
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - ENVIRONMENT=${ENVIRONMENT:-dev}
      - WG_DASHBOARD_USERNAME=${WG_DASHBOARD_USERNAME:-admin}
      - WG_DASHBOARD_PASSWORD=${WG_DASHBOARD_PASSWORD}
    volumes:
      # WireGuard設定ディレクトリをマウント（ホスト側で動作中のWireGuard）
      - /etc/wireguard:/etc/wireguard
      # WGDashboard設定永続化
      - ./data/wgdashboard:/opt/wireguarddashboard/src/db
      - ./data/wgdashboard/log:/opt/wireguarddashboard/src/log
    privileged: true

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-${ENVIRONMENT:-dev}.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      - wgdashboard
    extra_hosts:
      - "host.docker.internal:host-gateway"  # hostmodeのwgdashboardへアクセス    
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    networks:
      - wireguard-network

  # Certbot for Let's Encrypt SSL (prod environment only)
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - wireguard-network
    profiles:
      - prod

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: wgdashboard-node-exporter
    restart: always
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    pid: host
    networks:
      - wireguard-network

networks:
  wireguard-network:
    driver: bridge