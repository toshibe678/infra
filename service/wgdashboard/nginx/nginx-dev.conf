events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=wgdash_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=wgdash_login:10m rate=3r/m;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # WGDashboard upstream (host network mode)
    upstream wgdashboard {
        server host.docker.internal:10086;
    }

    # HTTP server (Development environment - no SSL)
    server {
        listen 80;
        server_name vpn-dev.abe365.org;

        # Security headers (less strict for dev environment)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Connection limit
        limit_conn addr 10;

        # Basic Authentication (additional security layer)
        auth_basic "WireGuard Management - Restricted Access";
        auth_basic_user_file /etc/nginx/htpasswd;

        # WGDashboard
        location / {
            # Rate limiting
            limit_req zone=wgdash_limit burst=20 nodelay;
            
            proxy_pass http://wgdashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Disable buffering for real-time features
            proxy_buffering off;
        }

        # API endpoints
        location /api/ {
            limit_req zone=wgdash_limit burst=50 nodelay;
            auth_basic "WireGuard Management - Restricted Access";
            auth_basic_user_file /etc/nginx/htpasswd;
            
            proxy_pass http://wgdashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            
            # JSON content type hint
            default_type application/json;
        }

        # Login endpoint (stricter rate limit)
        location /login {
            limit_req zone=wgdash_login burst=3 nodelay;
            
            proxy_pass http://wgdashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        # Static assets - with longer cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://wgdashboard;
            proxy_cache_valid 200 7d;
            add_header Cache-Control "public, max-age=604800";
        }
    }
}
