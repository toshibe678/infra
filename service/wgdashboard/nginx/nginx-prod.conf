events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # WGDashboard upstream (both on host network mode)
    upstream wgdashboard {
        server localhost:10086;
    }

    # バージョン情報を応答ヘッダー・エラーページに出さない
    server_tokens off;

    # HTTP catch-all: vpn.toshi.click 以外の Host（IP 直打ち・スキャナ等）は応答せず切断する
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # HTTP server - Let's Encrypt の HTTP-01 チャレンジ専用。管理画面へは一切 proxy しない
    server {
        listen 80;
        server_name vpn.toshi.click;

        # Let's Encrypt HTTP-01 challenge (certbot renew --webroot)。検証は GET のみ
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            limit_except GET { deny all; }
        }

        # Redirect all other HTTP traffic to HTTPS（Host ヘッダーを反映しない固定先）
        location / {
            return 301 https://vpn.toshi.click$request_uri;
        }
    }

    # HTTPS server (Production environment - Internet accessible, Let's Encrypt)
    server {
        listen 443 ssl http2;
        server_name vpn.toshi.click;

        # SSL configuration (初回発行は Ansible service_compose、更新は certbot コンテナ)
        # Let's Encrypt は OCSP を廃止済みのため OCSP stapling は設定しない
        ssl_certificate /etc/letsencrypt/live/vpn.toshi.click/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vpn.toshi.click/privkey.pem;

        # SSL security settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Security headers (strict for production)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob:; font-src 'self' data:;" always;

        # WGDashboard
        location / {
            proxy_pass http://wgdashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Increased timeouts for WireGuard operations
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Login endpoint - stricter rate limit
        location ~ ^/(api/login|signin) {
            
            proxy_pass http://wgdashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint (no auth required)
        location /health {
            auth_basic off;
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Deny access to sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
