version: '3.8'

services:
  # Ollama (Local LLM Runtime)
  ollama:
    image: ollama/ollama:latest
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    networks:
      - ai-test-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Open WebUI (Ollama Frontend)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: always
    expose:
      - "8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    volumes:
      - ./data/open-webui:/app/backend/data
    depends_on:
      - ollama
    networks:
      - ai-test-network

  # LangChain Serve (optional)
  langserve:
    build:
      context: ./langserve
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./langserve:/app
    networks:
      - ai-test-network

  # MLflow (Model Tracking)
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    restart: always
    expose:
      - "5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mlflow}
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - ./data/mlflow:/mlflow
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mlflow}
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    depends_on:
      - postgres
    networks:
      - ai-test-network

  # PostgreSQL (for MLflow)
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-mlflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-mlflow}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - ai-test-network

  # Qdrant (Vector Database)
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    expose:
      - "6333"
      - "6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - ai-test-network

  # Text Generation WebUI
  text-generation-webui:
    image: atinoda/text-generation-webui:default
    restart: always
    expose:
      - "7860"
    environment:
      - CLI_ARGS=--listen --api
    volumes:
      - ./data/text-generation-webui:/app/models
    networks:
      - ai-test-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Ray Serve (Distributed ML Serving)
  ray-head:
    image: rayproject/ray:latest
    restart: always
    expose:
      - "8265"
      - "10001"
    command: ray start --head --dashboard-host=0.0.0.0 --port=6379 --dashboard-port=8265 --block
    volumes:
      - ./ray:/home/ray
    networks:
      - ai-test-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - open-webui
      - mlflow
      - qdrant
    networks:
      - ai-test-network

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: ai-test-node-exporter
    restart: always
    expose:
      - "9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    networks:
      - ai-test-network

networks:
  ai-test-network:
    driver: bridge
