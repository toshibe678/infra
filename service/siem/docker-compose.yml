version: "3.8"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-9.1.2}
    container_name: es01
    environment:
      - node.name=es01
      - discovery.type=single-node
      - cluster.name=demo-elastic
      - xpack.security.enabled=false           # ← 開発用。認証を無効化
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9200/_cluster/health?pretty"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - siem-network

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-9.1.2}
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    networks:
      - siem-network

  logstash:
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION:-9.1.2}
    container_name: logstash
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    ports:
      - "5044:5044"    # Beats入力
      - "50000:50000"  # TCP入力（例）
      - "9600:9600"    # Logstashモニタリング API
    depends_on:
      - elasticsearch
    networks:
      - siem-network

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: wgdashboard-node-exporter
    restart: always
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    pid: host
    networks:
      - siem-network

networks:
  siem-network:
    driver: bridge

volumes:
  esdata:
