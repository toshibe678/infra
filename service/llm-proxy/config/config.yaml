      vertex_location: os.environ/VERTEX_LOCATION

# LiteLLM Settings
litellm_settings:
  # パラメータのドロップを許可（プロバイダー間の互換性向上）
  drop_params: true

  # Prometheusメトリクスを有効化
  callbacks:
    - prometheus
  # 内部ネットワークからの監視なので認証不要
  require_auth_for_metrics_endpoint: false
  # 起動時に予算系メトリクスを初期化（ダッシュボードの空洞期間防止）
  prometheus_initialize_budget_metrics: true
  # ラベル制限は未指定（LiteLLMデフォルトに委譲）
  
  # 詳細ログの設定
  set_verbose: false
  
  # キャッシング設定
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    password: os.environ/REDIS_PASSWORD
  
  # タイムアウト設定（秒）
  request_timeout: 600
  
  # リトライ設定
  num_retries: 3
  
  # ロードバランシング/フォールオーバー設定
  # usage-based-routing: 使用量ベース
  # latency-based-routing: レイテンシベース
  # simple-shuffle: ランダム
  # least-busy: 最も負荷の低いものを選択
  routing_strategy: usage-based-routing
  
  # フォールバック設定
  fallbacks: [
    {"claude-4.5-sonnet-fallback": ["bedrock/anthropic.claude-sonnet-4-5-v1:0", "vertex_ai/claude-sonnet-4-5@20250101"]},
    {"claude-4.5-haiku-fallback": ["bedrock/anthropic.claude-haiku-4-5-v1:0", "vertex_ai/claude-haiku-4-5@20250101"]},
    {"claude-4.5-opus-fallback": ["bedrock/anthropic.claude-opus-4-5-v1:0", "vertex_ai/claude-opus-4-5@20250101"]}
  ]
  
  # リトライ時のフォールバック有効化
  enable_fallback_on_429: true

# 一般設定
general_settings:
  # マスターキー（環境変数から取得）
  master_key: os.environ/LITELLM_MASTER_KEY
  
  # データベース設定
  database_url: os.environ/DATABASE_URL
  
  # コスト追跡の有効化
  track_cost_per_key: true
  
  # 使用量制限（トークン/日）
  # max_budget: 100
  # budget_duration: 1d
  
  # レート制限（リクエスト/分）
  # max_rpm: 60
