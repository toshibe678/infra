server:
  http_listen_port: 3200
  log_level: info

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

distributor:
  receivers: [otlp]

ingester:
  trace_idle_period: 5m
  max_block_duration: 2h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces

query_frontend:
  max_retries: 5

compactor:
  compaction_retention: 1h
