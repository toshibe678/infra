services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./config/otel-collector.yml:/etc/otel-collector.yml:ro
      - ./container_data/otel-collector:/var/lib/otelcol
    command: ["--config=/etc/otel-collector.yml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    depends_on:
      - loki
      - tempo
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prom-rules.yml:/etc/prometheus/prom-rules.yml:ro
      - ./container_data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    depends_on:
      - snmp-exporter

  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./container_data/alertmanager:/alertmanager

  loki:
    image: grafana/loki:latest
    volumes:
      - ./config/loki-config.yml:/etc/loki/local-config.yml:ro
      - ./container_data/loki:/loki

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./config/promtail-config.yml:/etc/promtail/promtail.yml:ro
      - /var/log:/var/log
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:latest
    volumes:
      - ./config/tempo-config.yml:/etc/tempo/tempo.yml:ro
      - ./container_data/tempo:/var/tempo

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./config/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/providers.yml:ro
      - ./container_data/grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

  snmp-exporter:
    image: prom/snmp-exporter:latest
    container_name: snmp-exporter
    volumes:
      - ./config/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    ports:
      - "9116:9116"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: monitoring-nginx
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - grafana
      - prometheus
      - alertmanager
      - loki
      - tempo
    restart: unless-stopped
