services:
  # otel-collector:
  #   image: otel/opentelemetry-collector-contrib:latest
  #   volumes:
  #     - ./config/otel-collector.yml:/etc/otel-collector.yml:ro
  #   command: ["--config=/etc/otel-collector.yml"]
  #   ports:
  #     - "4317:4317"
  #     - "4318:4318"
  #     - "9464:9464"
  #   depends_on:
  #     - loki
  #     - tempo
  #     - prometheus

  prometheus:
    image: prom/prometheus:latest
    environment:
      - BASE_URL=${BASE_URL}
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prom-rules.yml:/etc/prometheus/prom-rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
      - "--web.external-url=${BASE_URL}/prometheus/"
      - "--web.route-prefix=/"
    depends_on:
      - snmp-exporter

  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./config/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

  # loki:
  #   image: grafana/loki:latest
  #   volumes:
  #     - ./config/loki-config.yml:/etc/loki/local-config.yml:ro

  # promtail:
  #   image: grafana/promtail:latest
  #   volumes:
  #     - ./config/promtail-config.yml:/etc/promtail/promtail.yml:ro
  #     - /var/log:/var/log
  #   command: -config.file=/etc/promtail/promtail.yml
  #   depends_on:
  #     - loki

  # tempo:
  #   image: grafana/tempo:latest
  #   volumes:
  #     - ./config/tempo-config.yml:/etc/tempo/tempo.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=${BASE_URL}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_DEFAULT_LANGUAGE=ja-JP
    volumes:
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./config/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/providers.yml:ro
      - ./dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      # - loki
      # - tempo

  snmp-exporter:
    image: prom/snmp-exporter:latest
    container_name: snmp-exporter
    volumes:
      - ./config/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    ports:
      - "9116:9116"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: monitoring-nginx
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - grafana
      - prometheus
      - alertmanager
      # - loki
      # - tempo
    restart: unless-stopped

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter
    restart: always
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    pid: host

volumes:
  grafana-data:
