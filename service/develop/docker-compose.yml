services:
  # Code Server (VS Code in browser)
  code-server:
    image: codercom/code-server:latest
    restart: always
    expose:
      - "8080"
    environment:
      - PASSWORD=${CODE_SERVER_PASSWORD}
      - SUDO_PASSWORD=${SUDO_PASSWORD}
      - DOCKER_USER=${USER:-developer}
    volumes:
      - ./workspace:/home/coder/project
      - ./config:/home/coder/.config
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - develop-network

  # JupyterLab
  jupyter:
    image: jupyter/datascience-notebook:latest
    restart: always
    expose:
      - "8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data
    networks:
      - develop-network

  # PostgreSQL Development Database
  postgres:
    image: postgres:15-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-developer}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-devdb}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - develop-network

  # Redis Development Cache
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks:
      - develop-network

  # MongoDB Development Database
  mongo:
    image: mongo:7
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - ./data/mongo:/data/db
    networks:
      - develop-network

  # Adminer (Database Management)
  adminer:
    image: adminer:latest
    restart: always
    expose:
      - "8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    networks:
      - develop-network

  # Portainer (Docker Management)
  portainer:
    image: portainer/portainer-ce:latest
    restart: always
    expose:
      - "9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
    networks:
      - develop-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - code-server
      - jupyter
      - adminer
      - portainer
    networks:
      - develop-network

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: develop-node-exporter
    restart: always
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    pid: host
    networks:
      - develop-network

networks:
  develop-network:
    driver: bridge
